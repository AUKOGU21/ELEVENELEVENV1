<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElevenEleven</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F4EF; }
    body { display: flex; flex-direction: column; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #141210; }
    #stage { position: relative; flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #wait {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    }
    #wait b { font-weight: 700; } #wait span { font-weight: 300; }

    /* The opt-in for the logo on product photos. One quiet line, never in the way. */
    #optin {
      display: none; align-items: center; gap: 12px; padding: 10px 14px;
      background: #FFFFFF; border-bottom: 1px solid rgba(20,18,16,0.14);
      font-size: 12.5px; line-height: 1.4;
    }
    #optin p { margin: 0; flex: 1; color: #3A3632; }
    #optin button { font: inherit; background: none; border: 0; padding: 4px; cursor: pointer; }
    #turnOn { color: #761919; font-weight: 700; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
    #later { color: #8A8178; font-size: 16px; line-height: 1; }
  </style>
</head>
<body>
  <div id="optin" role="region" aria-label="Logo on product photos">
    <p id="optinText">Post straight from product photos.</p>
    <button id="turnOn" type="button">Turn on</button>
    <button id="later" type="button" aria-label="Not now">&times;</button>
  </div>
  <div id="stage">
    <div id="wait"><b>ELEVEN</b><span>ELEVEN</span></div>
    <iframe id="app" title="ElevenEleven" allow="clipboard-write"></iframe>
  </div>
  <script src="panel.js"></script>
</body>
</html>
